name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The backup tests drive the real sqlite3 CLI and age; they are skipped without them.
      - name: Install sqlite3 CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 age
      # The album picture (src/ops/monthly_album.py); the host has python3-pil.
      - name: Install Pillow
        run: python -m pip install --quiet pillow==11.3.0
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  # The same suite on a shifted clock: a test that silently depends on today's date (a
  # fixed date in a fixture next to the wall clock) fails here, in the pull request,
  # instead of on some morning months later. The backup script tests skip themselves:
  # they compare file times written by the kernel with the clock.
  python-shifted-clock:
    name: Python tests — clock ${{ matrix.clock }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        clock: ["+365d", "@2028-02-29 23:30:00"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libfaketime and Pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq faketime
          python -m pip install --quiet pillow==11.3.0
      - name: Run unit tests on the shifted clock
        env:
          FAKETIME_DONT_FAKE_MONOTONIC: "1"
        run: faketime -f "${{ matrix.clock }}" python -m unittest discover -s tests

  worker:
    name: Worker — tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Routing and reaction-label tests
        run: npm test

  shell:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck --severity=warning ops/backup/game-backup.sh ops/backup/offsite-git.sh ops/deploy.sh
