name: LLM evals

# Runs the semantic feedback evals against real Workers AI models.
# Manual only: model calls consume the Workers AI quota, and the project's
# cost policy forbids unplanned spend. Required repository secrets:
#   CLOUDFLARE_API_TOKEN  (Workers AI + Workers Scripts edit)
#   CLOUDFLARE_ACCOUNT_ID
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate
        type: choice
        options: [baseline, gemma, glm]
        default: baseline
      case:
        description: Single case id (empty = all cases)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  feedback-evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci

      - name: Start eval worker (remote Workers AI binding)
        run: |
          npx wrangler dev --remote -c wrangler.evals.jsonc --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8787/ && exit 0
            sleep 2
          done
          cat wrangler.log; exit 1

      - name: Run feedback evals
        env:
          MODEL: ${{ inputs.model }}
          CASE: ${{ inputs.case }}
        run: |
          curl -s --max-time 1500 -G http://127.0.0.1:8787/__evals/feedback \
            --data-urlencode "model=${MODEL}" \
            ${CASE:+--data-urlencode "case=${CASE}"} > report.json
          node evals/summarizeLlmEvals.js < report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-evals-${{ inputs.model }}
          path: |
            worker/report.json
            worker/wrangler.log
